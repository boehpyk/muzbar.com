# Development override — MUST be passed explicitly (never auto-loaded), which is the safety
# mechanism that keeps dev config (open ports, Xdebug) off production.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# All published ports bind to 127.0.0.1 only (Docker bypasses UFW — see infrastructure.md).
services:
  app:
    build:
      target: development
    volumes:
      - ./src:/var/www/html          # live-mounted source
    environment:
      # Dev mode is a property of *loading this override file*, not of a value someone copied into a
      # gitignored .env. The image bakes `ENV APP_ENV=prod` (docker/php/Dockerfile) so the safe value
      # is the default everywhere; this line is what makes `make up.dev` a dev box. Compose's
      # `environment:` outranks `env_file:`, so it also wins over the root .env.
      #
      # Without this, dev-ness came from `.env.example`'s `APP_ENV=dev` — meaning the file you copy
      # to get a working laptop was also the file that would silently put the VDS in dev mode.
      APP_ENV: dev
      XDEBUG_MODE: "off"             # set to "debug" to step-debug

  messenger-worker:
    # Same dev treatment as `app`: live-mounted source and the `development` build target, so a
    # code change reaches the worker without a rebuild — otherwise every edit would need
    # `up.dev --build` just to see it picked up by the consumer.
    build:
      target: development
    volumes:
      - ./src:/var/www/html
    environment:
      APP_ENV: dev

  nginx:
    ports:
      - "127.0.0.1:8080:80"          # http://localhost:8080
    volumes:
      - ./src/public:/var/www/html/public
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"        # web UI
      - "127.0.0.1:1025:1025"        # SMTP
