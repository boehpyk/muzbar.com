# Development override — MUST be passed explicitly (never auto-loaded), which is the safety
# mechanism that keeps dev config (open ports, Xdebug) off production.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# All published ports bind to 127.0.0.1 only (Docker bypasses UFW — see infrastructure.md).
services:
  app:
    build:
      target: development
    volumes:
      - ./src:/var/www/html          # live-mounted source
    environment:
      # Dev mode is a property of *loading this override file*, not of a value someone copied into a
      # gitignored .env. The image bakes `ENV APP_ENV=prod` (docker/php/Dockerfile) so the safe value
      # is the default everywhere; this line is what makes `make up.dev` a dev box. Compose's
      # `environment:` outranks `env_file:`, so it also wins over the root .env.
      #
      # Without this, dev-ness came from `.env.example`'s `APP_ENV=dev` — meaning the file you copy
      # to get a working laptop was also the file that would silently put the VDS in dev mode.
      APP_ENV: dev
      XDEBUG_MODE: "off"             # set to "debug" to step-debug
      # Disables framework.trusted_proxies (see the falsy-check in Kernel::initializeContainer()).
      # `.env.example` defaults TRUSTED_PROXIES to the prod-correct private-range list because there
      # a real proxy (Traefik) always sits in front of nginx; here nginx's port is published straight
      # to the host with nothing in front of it, so trusting a private-range peer would let anyone who
      # can reach 127.0.0.1:8080 hand-craft X-Forwarded-For and forge any client IP, defeating the
      # IP-keyed rate limiters (AC-18) this exists to protect and making dev unfaithful for testing
      # them. Empty here means REMOTE_ADDR is trusted as-is, same as before this was configured.
      TRUSTED_PROXIES: ""

  messenger-worker:
    # Same dev treatment as `app`: live-mounted source and the `development` build target, so a
    # code change reaches the worker without a rebuild — otherwise every edit would need
    # `up.dev --build` just to see it picked up by the consumer.
    build:
      target: development
    volumes:
      - ./src:/var/www/html
      # ...but NOT a shared container cache, and this line was paid for in debugging.
      #
      # The live mount means `app` and this container see one `var/cache/dev`. Symfony warms the
      # cache into a hash-named directory and only then swaps it in, so two processes warming
      # concurrently — which is exactly what happens the first time each container serves a request
      # after a code change — can leave one of them holding a container hash whose service files the
      # other has already replaced. It surfaces as
      # `require(var/cache/dev/ContainerXXXX/getSomeService.php): Failed to open stream`, a hard 500
      # on every route including the error controller, from an application that is completely
      # correct and a test suite that is entirely green.
      #
      # An anonymous volume here gives the worker its own cache directory while keeping the source
      # live. Prod needs nothing equivalent: there is no bind mount, so each container already has
      # its own copy of `var/`.
      - /var/www/html/var/cache
    environment:
      APP_ENV: dev
      # NOT OPTIONAL — LEFT OFF ONCE, AND THE WORKER RESTART-LOOPED INSTEAD OF DRAINING MAIL. This
      # container shares `framework.yaml` with `app`, which reads `%env(default::TRUSTED_PROXIES)%`
      # unconditionally on every kernel boot (`Kernel::initializeContainer()` runs for console
      # commands too, not just HTTP requests). `default::` now means a missing var degrades to "no
      # trust" instead of a hard `EnvNotFoundException` crash, but that is a safety net, not a reason
      # to omit the var here — see the `app` service above for why empty is the correct value in dev.
      TRUSTED_PROXIES: ""

  nginx:
    ports:
      - "127.0.0.1:8080:80"          # http://localhost:8080
    volumes:
      - ./src/public:/var/www/html/public
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"        # web UI
      - "127.0.0.1:1025:1025"        # SMTP
