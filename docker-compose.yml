name: muzbar

# Production stack. No container_name (Compose prefixes with the project name) so this
# coexists with samolit on the same VDS. No datastore ports are published in prod.
services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      # Prod has no source tree on the host: nginx serves public/ from a shared volume the
      # app image fills on start (see docker-entrypoint.prod.sh). The dev override replaces
      # this with a ./src/public bind mount. Only default.conf is shipped to the box.
      - public_assets:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.muzbar.rule=Host(`muzbar.com`)"
      - "traefik.http.routers.muzbar.entrypoints=websecure"
      - "traefik.http.routers.muzbar.tls.certresolver=le"
    networks:
      - default
      - traefik
    depends_on:
      - app
    restart: unless-stopped

  app:
    # Prod pulls this immutable image (set MUZBAR_IMAGE=ghcr.io/<owner>/muzbar:<sha> on the VDS).
    # Locally, `build` tags the same name so `up --build` works without a registry.
    image: ${MUZBAR_IMAGE:-muzbar-app:local}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    env_file: .env
    volumes:
      - public_assets:/mnt/public   # entrypoint publishes this image's public/ here for nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  messenger-worker:
    # Runs the same code as `app` — same image, just a different entrypoint command — so it needs
    # no separate build/image config, only its own `command:`.
    image: ${MUZBAR_IMAGE:-muzbar-app:local}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    env_file: .env
    # The image's entrypoint exists to publish `public/` into the volume nginx serves. This
    # container mounts no such volume and answers no HTTP, so running it would copy assets into the
    # container's own filesystem for nobody to read — once an hour, forever, thanks to the restart
    # loop below. Cleared rather than tolerated; `command:` is a full argv and needs no wrapper.
    entrypoint: []
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M"]
    # No `ports:` and no `public_assets` volume: this process serves nothing over HTTP, it only
    # drains the `async` transport (mail today; more later).
    #
    # `--time-limit=3600` + `restart: unless-stopped` is the supervisor-free pattern for a one-box
    # budget: Messenger exits cleanly once an hour (bounding the effect of any slow memory leak
    # between restarts — see infrastructure.md footgun #6) and Compose's restart policy brings it
    # straight back up, with no separate supervisord/systemd unit to install and monitor.
    #
    # Watched consequence (ADR-0010): a stopped or crash-looping worker looks *exactly* like a
    # healthy system to every check this stack has today. `/health/ready` probes Postgres and
    # Redis, not queue depth — so this container can sit down silently and nothing here will turn
    # red. Accepted for this slice; teaching `/health/ready` to notice a stale queue is Phase 2
    # work (docs/specs/identity-email-verification/technical-plan.md, Risks #2).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data   # named volume only (stale-password footgun)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]  # always password-protected
    volumes:
      - redis_data:/data
    restart: unless-stopped

networks:
  default: {}
  traefik:
    external: true   # shared proxy network, created once on the VDS

volumes:
  postgres_data:
  redis_data:
  public_assets:   # nginx serves this; the app container fills it on start (prod only)
