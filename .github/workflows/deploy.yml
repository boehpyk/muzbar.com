name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Automatic on merge: build the immutable image and push to GHCR.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Manual gate: bound to the `production` Environment. Add a required reviewer on that Environment
  # in GitHub settings — that approval IS the gate. Prod pulls the image; it never builds.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Ship the non-secret runtime config to the box. The app code ships inside the image;
      # only the compose file and nginx conf need to live on the host (bind-mounted). The
      # prod .env is created on the box by hand, once, and is never shipped from CI.
      - name: Sync compose + nginx config to the VDS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          source: "docker-compose.yml,docker/nginx/default.conf"
          target: /home/muzbar-deploy/muzbar.com

      - name: Release over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: GITHUB_SHA,GITHUB_REPOSITORY,GITHUB_ACTOR
          script: |
            set -euo pipefail
            cd /home/muzbar-deploy/muzbar.com
            export MUZBAR_IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}"
            # Persist the deployed image into .env so hand-run `docker compose` on the box
            # targets the right image instead of defaulting to muzbar-app:local and trying to
            # build (the build context isn't shipped to prod). Rewrite in place via a temp file
            # + `cat >` so .env keeps its 600 perms and owner.
            tmp="$(mktemp)"
            grep -v '^MUZBAR_IMAGE=' .env > "$tmp" || true
            echo "MUZBAR_IMAGE=${MUZBAR_IMAGE}" >> "$tmp"
            cat "$tmp" > .env
            rm -f "$tmp"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            # `messenger-worker` runs the same image as `app` with a different command, and it was
            # absent from both lines below until 2026-08-02 — so it kept whatever image it last had,
            # indefinitely, across four releases. The only symptom was behaviour not matching source.
            # It matters more than it looks: Twig mail templates are rendered by `BodyRenderer` at
            # *send* time, which happens in the worker — so a slice that ships a new mail template
            # deploys an `app` that queues the message and a worker that cannot render it. The result
            # is a failed queue message in a transport nobody reads, not an error anyone sees.
            docker compose pull app messenger-worker
            docker compose up -d app nginx
            # Stopped for the migration window rather than just restarted after it. The worker is the
            # one process that keeps executing application code while `migrate` runs, so leaving it up
            # means old code writing against a schema that is changing under it. Messenger handles
            # SIGTERM by finishing the message in flight, and mail is queued rather than lost.
            docker compose stop messenger-worker
            docker compose exec -T app php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
            docker compose exec -T app php bin/console cache:clear
            # Started last, on the new image, against the migrated schema.
            docker compose up -d messenger-worker
            # Prove it rather than hope. This bug survived four releases precisely because a stale
            # worker is invisible from the outside, so the deploy now fails loudly instead of
            # succeeding quietly with a container running last month's code.
            for svc in app messenger-worker; do
              running="$(docker compose ps -q "$svc" | xargs -r docker inspect -f '{{.Config.Image}}')"
              if [ "$running" != "$MUZBAR_IMAGE" ]; then
                echo "::error::$svc is running '$running', expected '$MUZBAR_IMAGE'"
                exit 1
              fi
            done

      - name: Smoke check
        run: curl -fsS --retry 5 --retry-delay 3 https://muzbar.com/health/ready
