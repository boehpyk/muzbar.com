doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        # `prelaunch_signup` is written with raw DBAL and has no ORM mapping, so without this the
        # schema diff would propose dropping it on every `make migration.make`. Remove this line in
        # the same commit that drops the table.
        schema_filter: '~^(?!prelaunch_signup$)~'

        # Custom DBAL types map Identity's value objects onto columns.
        #
        # WHY TYPES AND NOT EMBEDDABLES: every one of these VOs is a single value in a single
        # column. An embeddable would demand its own mapping document per one-field object and
        # cannot express a single-column unique index cleanly — three times the ceremony for the
        # same result. Types keep the mapping XML readable and the conversion logic unit-testable.
        #
        # FOOTGUN TO RESPECT: Doctrine's UnitOfWork compares custom-typed values with `!==`, so
        # replacing a value object with an equal-but-distinct instance marks the entity dirty and
        # emits a harmless UPDATE. Our VOs are immutable and only ever replaced on a real change,
        # which is exactly why they must never be mutated in place.
        types:
            identity_user_id: App\Infrastructure\Identity\Persistence\Doctrine\Type\UserIdType
            identity_email: App\Infrastructure\Identity\Persistence\Doctrine\Type\EmailType
            identity_password_hash: App\Infrastructure\Identity\Persistence\Doctrine\Type\HashedPasswordType
            identity_role_set: App\Infrastructure\Identity\Persistence\Doctrine\Type\RoleSetType
            # Added by `identity-email-verification` for the context's second aggregate. Registered
            # here rather than beside the mapping because a DBAL type is global to the connection:
            # the name is what the XML refers to, and an unregistered name is an "Unknown column
            # type" at cache warm-up, not at the query that needed it.
            identity_email_verification_request_id: App\Infrastructure\Identity\Persistence\Doctrine\Type\EmailVerificationRequestIdType
            identity_verification_token_hash: App\Infrastructure\Identity\Persistence\Doctrine\Type\HashedVerificationTokenType
            # Added by `identity-password-reset` for the context's third aggregate. Note that this
            # list, unlike the mapping block below, does NOT pick up new files by itself: the
            # directory scan finds `PasswordResetRequest.orm.xml` on its own, but the type names it
            # refers to exist only because they are written here. An unregistered name fails at cache
            # warm-up with "Unknown column type", not at the query that needed it.
            identity_password_reset_request_id: App\Infrastructure\Identity\Persistence\Doctrine\Type\PasswordResetRequestIdType
            identity_reset_token_hash: App\Infrastructure\Identity\Persistence\Doctrine\Type\HashedResetTokenType
            # Added by `identity-google-oauth` (ADR-0014): the User's linked provider identities.
            identity_oauth_identity_set: App\Infrastructure\Identity\Persistence\Doctrine\Type\OAuthIdentitySetType
            # Added by `catalog-category-tree` (ADR-0016): the Catalog context's first aggregate.
            catalog_category_id: App\Infrastructure\Catalog\Persistence\Doctrine\Type\CategoryIdType
            catalog_category_name: App\Infrastructure\Catalog\Persistence\Doctrine\Type\CategoryNameType
            catalog_category_slug: App\Infrastructure\Catalog\Persistence\Doctrine\Type\CategorySlugType
            # Added by `catalog-attribute-schema` (ADR-0017): `Attribute` and `AttributeOption`.
            catalog_attribute_id: App\Infrastructure\Catalog\Persistence\Doctrine\Type\AttributeIdType
            catalog_attribute_option_id: App\Infrastructure\Catalog\Persistence\Doctrine\Type\AttributeOptionIdType
            catalog_attribute_code: App\Infrastructure\Catalog\Persistence\Doctrine\Type\AttributeCodeType
            catalog_attribute_label: App\Infrastructure\Catalog\Persistence\Doctrine\Type\AttributeLabelType
            catalog_attribute_number_rules: App\Infrastructure\Catalog\Persistence\Doctrine\Type\NumberRulesType
            # Added by `listing-draft` (ADR-0019): the Listing context's first aggregate. `Price` is
            # NOT here: it is two columns, so it is an embeddable (ADR-0007 amendment).
            listing_listing_id: App\Infrastructure\Listing\Persistence\Doctrine\Type\ListingIdType
            listing_seller_id: App\Infrastructure\Listing\Persistence\Doctrine\Type\SellerIdType
            listing_category_id: App\Infrastructure\Listing\Persistence\Doctrine\Type\CategoryIdType
            listing_title: App\Infrastructure\Listing\Persistence\Doctrine\Type\ListingTitleType
            listing_description: App\Infrastructure\Listing\Persistence\Doctrine\Type\ListingDescriptionType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true

        # One mapping block per bounded context, each pointing at XML that lives inside that
        # context's Infrastructure layer.
        #
        # The Symfony skeleton's `App` -> `src/Entity` attribute mapping was REMOVED here, not
        # merely left unused. It was a trap: it made `App\Entity\Something` with ORM attributes on
        # it the path of least resistance for `make:entity`, every tutorial and every reflex —
        # which is a class outside all three hexagonal layers, and a Constitution §4.2 violation
        # the moment such a class is treated as a domain object. Deleting the mapping and the
        # directory removes the temptation rather than documenting it.
        mappings:
            Identity:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/Identity/Persistence/Doctrine/mapping'
                prefix: 'App\Domain\Identity\Entity'
                alias: Identity
            Catalog:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/Catalog/Persistence/Doctrine/mapping'
                prefix: 'App\Domain\Catalog\Entity'
                alias: Catalog
            Listing:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/Listing/Persistence/Doctrine/mapping'
                prefix: 'App\Domain\Listing\Entity'
                alias: Listing
            # A mapping block has one namespace prefix, and `Price` (an embeddable, ADR-0007
            # amendment) lives in `ValueObject`, not `Entity` — hence a second block for the context.
            # Its directory is a SIBLING of `mapping/`, never inside it: the locator scans a block's
            # dir recursively and turns a subdirectory into a namespace segment, so
            # `mapping/embeddable/Price.orm.xml` would be read as `…\Entity\embeddable\Price`.
            ListingValueObjects:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/Listing/Persistence/Doctrine/embeddable'
                prefix: 'App\Domain\Listing\ValueObject'
                alias: ListingValueObjects

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
