framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
        missing_import_mode: strict
        # Sass partials are inlined into public.scss by Dart Sass; served on their own they would
        # only publish source files nobody links.
        excluded_patterns:
            - '**/assets/styles/_*.scss'

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
