# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
#
# Service wiring. Hexagonal layers:
#   Domain         — pure PHP, NOT services (entities, value objects, events, ports)
#   Application    — use cases (command/query handlers), auto-registered as services
#   Infrastructure — adapters, controllers, DI wiring, auto-registered as services
# Layer boundaries are enforced by Deptrac (deptrac.yaml); service registration is here.
parameters:

services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Register application code as services, excluding the pure-Domain layer and
    # framework entry points (which must not be services).
    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/'
            - '../src/Kernel.php'
            # DBAL types are instantiated by Doctrine's TypeRegistry from the class name, never
            # by the container. Registering them as services would create definitions nothing can
            # ever inject, and would imply they may take constructor dependencies — they may not.
            - '../src/Infrastructure/*/Persistence/Doctrine/Type/'

    # ------------------------------------------------------------------
    # Ports -> adapters
    #
    # Symfony auto-wires a class to an interface only when exactly one service implements it, and
    # never for an interface declared outside the registered namespace. Every Domain port
    # therefore needs an explicit alias, and a port with no binding is a bug: the container fails
    # at compile time, which is the earliest and cheapest place to find out.
    # ------------------------------------------------------------------
    App\Domain\Shared\Port\Clock: '@App\Infrastructure\Shared\Clock\SystemClock'
    App\Domain\Shared\Port\DomainEventDispatcher: '@App\Infrastructure\Shared\Event\SymfonyDomainEventDispatcher'
    App\Domain\Identity\Port\UserRepository: '@App\Infrastructure\Identity\Persistence\Doctrine\DoctrineUserRepository'
    App\Domain\Identity\Port\PasswordHasher: '@App\Infrastructure\Identity\Security\SymfonyPasswordHasher'

    # Redis client (Predis) built from REDIS_URL; aliased for autowiring by interface.
    Predis\Client:
        arguments: ['%env(REDIS_URL)%']
    Predis\ClientInterface: '@Predis\Client'
