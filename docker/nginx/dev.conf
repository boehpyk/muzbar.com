server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # DELIBERATELY NO `set_real_ip_from` / `real_ip_header` HERE — default.conf doesn't carry them
    # either now, but for a different reason (see its comment: nginx rewriting `$remote_addr` would
    # fight Symfony's own `trusted_proxies` trust check). Here the reason is simpler: there is no
    # reverse proxy in front of nginx in dev at all — `docker-compose.dev.yml` publishes this port
    # straight to `127.0.0.1:8080` on the host, so `$remote_addr` is already nginx's own honest view
    # of whoever connected, and there is no legitimate `X-Forwarded-For` to trust in the first place.
    # Trusting it anyway would let a local script hand-craft the header and forge any client IP it
    # likes — the same reasoning `TRUSTED_PROXIES: ""` in docker-compose.dev.yml documents on the
    # Symfony side. No custom `log_format` either, for the same reason: `$remote_addr` here is
    # already the truthful value, so the stock `main` format (which the base image already applies)
    # needs no correcting.

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # Longer timeout so Xdebug breakpoints don't trip a gateway timeout.
        fastcgi_read_timeout 3600;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 32m;
}
