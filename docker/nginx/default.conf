# `log_format` must live in the `http {}` context, not `server {}` — this file is spliced straight
# into the base image's `http {}` block via its `include /etc/nginx/conf.d/*.conf;`, so a directive
# placed here at the top, before `server {`, lands in the right scope.
#
# DELIBERATELY NO `ngx_http_realip_module` (`set_real_ip_from` / `real_ip_header`) IN THIS FILE — AN
# EARLIER VERSION HAD IT, AND IT SILENTLY UNDID HALF OF WHAT framework.yaml's `trusted_proxies` DOES.
# If nginx rewrites `$remote_addr` to the public client IP before proxying to php-fpm, that rewritten
# value is what reaches Symfony as `REMOTE_ADDR` (`fastcgi_param REMOTE_ADDR $remote_addr;`, from the
# stock `fastcgi_params`). A public IP is never inside `trusted_proxies`' private-range list, so
# `Request::isFromTrustedProxy()` then returns **false** — Symfony stops trusting the peer and never
# reads `X-Forwarded-Proto` / `X-Forwarded-Host` at all. `getClientIp()` still comes out right by
# accident (nginx already resolved it), but `isSecure()` and `getSchemeAndHttpHost()` stay wrong:
# `isSecure()` reads false (nginx really does speak plain HTTP to php-fpm; TLS ends at Traefik), and
# every absolute URL built from the current request keeps the internal scheme/host, not
# `https://muzbar.com`. `csrf.yaml` names exactly that scheme/host reconstruction as the precondition
# stateless CSRF depends on — so this file fixing `getClientIp()` while quietly re-breaking
# `isSecure()` would have left that precondition looking satisfied when it wasn't. Re-adding realip
# here does not just degrade a log field; it silently re-opens that trap.
#
# Symfony is the layer that owns reconstructing client IP, scheme and host — it needs `REMOTE_ADDR`
# to arrive untouched (Traefik's own private, dynamic-IP address) so its trust check actually engages
# and it reads all of `X-Forwarded-{For,Host,Proto,Port,Prefix}` together, consistently. See
# `config/packages/framework.yaml`.
#
# So nginx's own access log stays truthful without the realip module, by logging the header directly
# instead of a variable the module would otherwise rewrite. The email verification token travels in
# the URL path (see `EmailVerificationController::noReferrer()`'s docblock), so this log is part of
# the forensic trail if a token ever leaks — a forensic read starts from `xff`, not `$remote_addr`
# (which stays Traefik's own address, on purpose, for the reason above).
log_format muzbar_access '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" xff="$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    access_log /var/log/nginx/access.log muzbar_access;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    # Return 404 for any other .php file — only index.php is a front controller.
    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 16m;
}
