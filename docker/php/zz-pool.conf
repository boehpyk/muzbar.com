; PHP-FPM pool, chosen — not the stock image's `pm.max_children = 5` (search-benchmark Q6, ADR-0026).
; Loaded after www.conf and zz-docker.conf (php-fpm.d/*.conf, alphabetical; "zz-p" > "zz-d").
;
; Sizing (2026-11-24): 4 shared vCPU, 7.7 GB RAM, ~5.3 GB available, NO swap, four tenants.
; 12 = 3 × cores: more workers on 4 shared cores only move the queue from FPM into the CPU run
; queue. Worst case 12 × ~50 MB ≈ 0.6 GB. Hard cap: PostgreSQL max_connections (100) − 20, since
; each busy child holds one connection. Re-measure before changing (docs/infrastructure.md
; §Search: latency benchmark).
;
; NOT yet copied by the Dockerfile: measured on the box first (T10/T11a), shipped only if it moves p95.
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle children now and then: bounds a slow leak without a supervisor.
pm.max_requests = 1000
