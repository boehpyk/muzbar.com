; Development overrides. These only work if this file is scanned AFTER php.ini's copy, which is
; why the Dockerfile installs it as `zzz-app-dev.ini` rather than `zz-app-dev.ini` — see the
; comment there. Until 2026-07-30 it was the latter, which sorts BEFORE `zz-app.ini`, and the one
; key both files set (`opcache.validate_timestamps`) was silently reverted to the production 0.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
display_errors = On
error_reporting = E_ALL

; Xdebug — controlled via XDEBUG_MODE env (off | debug). Step-debug to the host.
xdebug.mode = ${XDEBUG_MODE}
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = yes
